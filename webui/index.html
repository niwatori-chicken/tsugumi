<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tsugumi chat</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e3e2dd;
    --user: #e9eef6; --accent: #2f5d9b; --code: #f1f0ec; --err: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --panel: #1f1f1d; --text: #e8e7e3; --muted: #9a9993; --line: #33332f;
      --user: #23303f; --accent: #8fb3e6; --code: #2a2a27; --err: #f2b8b5;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.6 system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif;
         display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--line);
           background: var(--panel); font-size: 13px; color: var(--muted); }
  header b { color: var(--text); font-size: 15px; margin-right: 4px; }
  header label { display: flex; gap: 4px; align-items: center; }
  header input[type=number] { width: 72px; }
  input, textarea, button { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
                            border-radius: 6px; }
  input { padding: 2px 6px; }
  button { padding: 4px 12px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  #status { margin-left: auto; }
  #board { font-variant-numeric: tabular-nums; white-space: nowrap; cursor: default; }
  #board.warn { color: #c2410c; }
  #log { flex: 1; overflow-y: auto; padding: 16px; }
  .msg { max-width: 860px; margin: 0 auto 14px; }
  .user .body { background: var(--user); border-radius: 10px; padding: 8px 12px; white-space: pre-wrap; display: inline-block; }
  .user { text-align: right; }
  .user .body { text-align: left; }
  .assistant .body { padding: 2px 2px; overflow-wrap: anywhere; }
  .assistant .body p { margin: 0 0 .6em; }
  details { margin-bottom: 6px; color: var(--muted); font-size: 13px; }
  details .think { white-space: pre-wrap; border-left: 2px solid var(--line); padding-left: 10px; margin-top: 4px; }
  pre { background: var(--code); padding: 10px 12px; border-radius: 6px; overflow-x: auto; font-size: 13px; line-height: 1.45; }
  code { font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; }
  :not(pre) > code { background: var(--code); padding: 1px 4px; border-radius: 4px; font-size: 13px; }
  .stats { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .err { color: var(--err); }
  footer { border-top: 1px solid var(--line); background: var(--panel); padding: 10px 16px; }
  .row { max-width: 860px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  textarea { flex: 1; resize: none; padding: 8px 10px; min-height: 44px; max-height: 40vh; line-height: 1.5; }
  #attach { padding: 4px 10px; }
  #pending { max-width: 860px; margin: 0 auto 6px; display: flex; gap: 6px; flex-wrap: wrap; }
  #pending:empty { display: none; }
  .thumb { position: relative; }
  .thumb img, .user .imgs img { height: 64px; max-width: 160px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); display: block; }
  .thumb button { position: absolute; top: -6px; right: -6px; padding: 0 6px; border-radius: 10px; font-size: 12px; line-height: 18px; }
  .user .imgs { display: flex; gap: 6px; justify-content: flex-end; margin-bottom: 4px; flex-wrap: wrap; }
  body.drag #log { outline: 2px dashed var(--accent); outline-offset: -8px; }
  .cursor::after { content: "▍"; animation: blink 1s steps(1) infinite; color: var(--muted); }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<header>
  <b>tsugumi</b>
  <label><input type="checkbox" id="think"> thinking</label>
  <label title="思考のトークン数の上限 (空欄 = サーバーの既定)">思考上限 <input type="number" id="tbudget" min="0" step="256" placeholder="なし"></label>
  <label>temperature <input type="number" id="temp" min="0" max="2" step="0.1" value="0"></label>
  <label>top_p <input type="number" id="topp" min="0" max="1" step="0.05" value="0.95"></label>
  <label>max tokens <input type="number" id="maxtok" min="1" step="256" value="4096"></label>
  <label>system <input type="text" id="sys" placeholder="(なし)" style="width: 180px"></label>
  <button id="new">新しい会話</button>
  <span id="status"></span>
  <span id="board"></span>
</header>
<div id="log"></div>
<footer>
  <div id="pending"></div>
  <div class="row">
    <button id="attach" title="画像を添付 (貼り付け・ドラッグ&ドロップでも可)">画像</button>
    <input type="file" id="file" accept="image/*" multiple hidden>
    <textarea id="input" rows="1" placeholder="メッセージ (Enter で送信、Shift+Enter で改行)"></textarea>
    <button id="send">送信</button>
  </div>
</footer>
<script>
const $ = (id) => document.getElementById(id);
const log = $("log"), input = $("input"), sendBtn = $("send"), status = $("status");
let history = [];   // OpenAI messages (assistant turns without reasoning, as clients usually send them)
let ctrl = null;    // AbortController of the running request
let pending = [];   // data: URLs of the images to send with the next message
const MAX_PIXELS = 1024 * 1024;  // larger images are scaled down here (the server would do it anyway)

function readImage(file) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = () => reject(fr.error);
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("画像を読めません"));
      img.onload = () => {
        const px = img.naturalWidth * img.naturalHeight;
        if (px <= MAX_PIXELS) return resolve(fr.result);
        const k = Math.sqrt(MAX_PIXELS / px);
        const c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(img.naturalWidth * k)); c.height = Math.max(1, Math.round(img.naturalHeight * k));
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL("image/jpeg", 0.92));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
async function addImages(files) {
  for (const f of files) {
    if (!f.type.startsWith("image/")) continue;
    try { pending.push(await readImage(f)); } catch (e) { status.textContent = e.message; }
  }
  showPending();
}
function showPending() {
  const box = $("pending");
  box.innerHTML = "";
  pending.forEach((u, i) => {
    const d = document.createElement("div");
    d.className = "thumb";
    d.innerHTML = '<img alt=""><button title="外す">×</button>';
    d.querySelector("img").src = u;
    d.querySelector("button").onclick = () => { pending.splice(i, 1); showPending(); };
    box.appendChild(d);
  });
}

const store = {     // remembered settings (per browser; failures are ignored)
  get(k, d) { try { const v = localStorage.getItem("tsugumi." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("tsugumi." + k, JSON.stringify(v)); } catch {} },
};
for (const [id, prop] of [["think", "checked"], ["temp", "value"], ["topp", "value"], ["maxtok", "value"], ["sys", "value"], ["tbudget", "value"]]) {
  $(id)[prop] = store.get(id, $(id)[prop]);
  $(id).addEventListener("change", () => store.set(id, $(id)[prop]));
}

function esc(s) { return s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

// small markdown: code fences, inline code, bold, headings, lists; everything else as paragraphs
function md(src) {
  const out = [];
  const parts = src.split(/^```/m);
  parts.forEach((part, i) => {
    if (i % 2 === 1) {  // fenced code: first line is the language
      const nl = part.indexOf("\n");
      out.push("<pre><code>" + esc(nl < 0 ? "" : part.slice(nl + 1)).replace(/\n$/, "") + "</code></pre>");
      return;
    }
    const inline = (t) => esc(t).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
    for (const block of part.split(/\n{2,}/)) {
      if (!block.trim()) continue;
      const lines = block.split("\n");
      if (lines.every((l) => /^\s*([-*]|\d+\.)\s/.test(l) || !l.trim())) {
        const ordered = /^\s*\d+\./.test(lines[0]);
        out.push((ordered ? "<ol>" : "<ul>") + lines.filter((l) => l.trim())
          .map((l) => "<li>" + inline(l.replace(/^\s*([-*]|\d+\.)\s/, "")) + "</li>").join("") + (ordered ? "</ol>" : "</ul>"));
      } else if (/^#{1,6}\s/.test(lines[0]) && lines.length === 1) {
        out.push("<p><b>" + inline(lines[0].replace(/^#+\s/, "")) + "</b></p>");
      } else {
        out.push("<p>" + lines.map(inline).join("<br>") + "</p>");
      }
    }
  });
  return out.join("");
}

function addMsg(role) {
  const el = document.createElement("div");
  el.className = "msg " + role;
  el.innerHTML = role === "assistant"
    ? '<details hidden><summary>考えた内容</summary><div class="think"></div></details><div class="body cursor"></div><div class="stats"></div>'
    : '<div class="body"></div>';
  log.appendChild(el);
  return el;
}
const atBottom = () => log.scrollHeight - log.scrollTop - log.clientHeight < 80;

async function send() {
  const text = input.value.trim();
  if ((!text && !pending.length) || ctrl) return;
  input.value = ""; autosize();
  const imgs = pending; pending = []; showPending();
  history.push({ role: "user", content: imgs.length
    ? imgs.map((u) => ({ type: "image_url", image_url: { url: u } })).concat(text ? [{ type: "text", text }] : [])
    : text });
  const ub = addMsg("user");
  if (imgs.length) {
    const row = document.createElement("div");
    row.className = "imgs";
    for (const u of imgs) { const im = document.createElement("img"); im.src = u; im.alt = ""; row.appendChild(im); }
    ub.insertBefore(row, ub.firstChild);
  }
  ub.querySelector(".body").textContent = text;
  if (!text) ub.querySelector(".body").hidden = true;
  const el = addMsg("assistant");
  const body = el.querySelector(".body"), think = el.querySelector(".think"), det = el.querySelector("details");
  log.scrollTop = log.scrollHeight;

  const temp = parseFloat($("temp").value) || 0;
  const msgs = ($("sys").value.trim() ? [{ role: "system", content: $("sys").value.trim() }] : []).concat(history);
  const req = { messages: msgs, stream: true, max_tokens: parseInt($("maxtok").value) || 4096,
                chat_template_kwargs: { enable_thinking: $("think").checked } };
  const tb = parseInt($("tbudget").value);
  if ($("think").checked && tb >= 0) req.thinking_budget = tb;
  if (temp > 0) Object.assign(req, { temperature: temp, top_p: parseFloat($("topp").value) || 1, top_k: 20 });

  ctrl = new AbortController();
  sendBtn.textContent = "停止";
  status.textContent = "生成中…";
  let content = "", reasoning = "", timings = null, usage = null;
  const t0 = performance.now();
  let tFirst = null;
  try {
    let r;
    for (;;) {  // with server authentication: ask for the API key once and keep it in this browser
      const headers = { "content-type": "application/json" };
      const key = store.get("apiKey", "");
      if (key) headers.authorization = "Bearer " + key;
      r = await fetch("/v1/chat/completions", { method: "POST", headers, body: JSON.stringify(req), signal: ctrl.signal });
      if (r.status !== 401) break;
      const k = prompt(key ? "API キーが違います。もう一度入力してください" : "このサーバーには API キーが必要です");
      if (!k) break;
      store.set("apiKey", k.trim());
    }
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error?.message || r.statusText);
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const line = buf.slice(0, i).trim();
        buf = buf.slice(i + 2);
        if (!line.startsWith("data: ") || line === "data: [DONE]") continue;
        const d = JSON.parse(line.slice(6));
        if (d.error) throw new Error(d.error.message);
        const delta = d.choices?.[0]?.delta || {};
        if ((delta.content || delta.reasoning_content) && tFirst === null) tFirst = performance.now();
        if (delta.reasoning_content) { reasoning += delta.reasoning_content; det.hidden = false; think.textContent = reasoning; }
        if (delta.content) content += delta.content;
        if (d.timings) timings = d.timings;
        if (d.usage) usage = d.usage;
        const stick = atBottom();
        body.innerHTML = md(content.replace(/^\s+/, ""));
        if (stick) log.scrollTop = log.scrollHeight;
      }
    }
  } catch (e) {
    if (e.name !== "AbortError") {
      const err = document.createElement("div");
      err.className = "err";
      err.textContent = "エラー: " + e.message;
      el.appendChild(err);
    }
  } finally {
    body.classList.remove("cursor");
    if (content || reasoning) history.push({ role: "assistant", content: content.replace(/^\s+/, "") });
    else history.pop();
    const s = el.querySelector(".stats");
    if (timings) {
      const t = timings, n = (x) => x.toLocaleString();
      const pre = [`プロンプト ${n(t.prompt_tokens)} トークン`];
      if (t.reused) pre.push(`再利用 ${n(t.reused)}`);
      if (t.images) pre.push(`画像 ${t.images.n} 枚 (${n(t.images.tokens)} トークン${t.images.encoded ? `, 読み込み ${t.images.seconds.toFixed(2)}s` : ", 読み込み済み"})`);
      if (t.prefilled !== undefined)
        pre.push(`prefill ${n(t.prefilled)} トークン ${t.t_prefill.toFixed(2)}s` + (t.prefilled >= 64 ? ` (${n(Math.round(t.prefill_tps))} tok/s)` : ""));
      pre.push(`応答開始 ${t.ttft.toFixed(2)}s`);
      const gen = [`生成 ${n(t.completion_tokens)} トークン ${t.decode_tps.toFixed(1)} tok/s`,
                   `${t.tokens_per_step.toFixed(2)} トークン/ステップ`];
      if (t.think_tokens !== undefined) gen.push(`思考 ${n(t.think_tokens)}${t.think_forced ? " (上限で打ち切り)" : ""}`);
      s.innerHTML = esc(pre.join(" · ")) + "<br>" + esc(gen.join(" · "));
    } else if (tFirst !== null) {
      s.textContent = `中断 · 応答開始 ${((tFirst - t0) / 1000).toFixed(2)}s`;
    }
    ctrl = null;
    sendBtn.textContent = "送信";
    status.textContent = "";
    input.focus();
  }
}

function autosize() { input.style.height = "auto"; input.style.height = input.scrollHeight + "px"; }
input.addEventListener("input", autosize);
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});
sendBtn.addEventListener("click", () => (ctrl ? ctrl.abort() : send()));
$("new").addEventListener("click", () => { if (ctrl) ctrl.abort(); history = []; pending = []; showPending(); log.innerHTML = ""; input.focus(); });
$("attach").addEventListener("click", () => $("file").click());
$("file").addEventListener("change", (e) => { addImages([...e.target.files]); e.target.value = ""; });
input.addEventListener("paste", (e) => {
  const files = [...(e.clipboardData?.files || [])].filter((f) => f.type.startsWith("image/"));
  if (files.length) { e.preventDefault(); addImages(files); }
});
document.addEventListener("dragover", (e) => { e.preventDefault(); document.body.classList.add("drag"); });
document.addEventListener("dragleave", (e) => { if (!e.relatedTarget) document.body.classList.remove("drag"); });
document.addEventListener("drop", (e) => { e.preventDefault(); document.body.classList.remove("drag"); addImages([...e.dataTransfer.files]); });
// board telemetry from /health (tt-smi, refreshed by the server every ~10 s); needs the API key when auth is on
function showBoard(b) {
  const el = $("board"), d = b?.data;
  if (!d) { el.textContent = ""; el.title = b?.error ? "ボード情報なし: " + b.error : ""; el.className = ""; return; }
  const warn = (d.asic_temp_c != null && d.throttle_temp_c != null && d.asic_temp_c >= d.throttle_temp_c - 10)
    || (d.aiclk_mhz != null && d.aiclk_max_mhz != null && d.aiclk_mhz < d.aiclk_max_mhz)
    || d.therm_trips > 0 || d.gddr_uncorr_errs > 0;
  el.className = warn ? "warn" : "";
  el.textContent = `${d.asic_temp_c}°C · チップ ${d.chip_power_w} W · fan ${d.fan_pct}%`;
  el.title = [
    `${d.board ?? "board"} (${b.age_s} 秒前)`,
    `チップ ${d.asic_temp_c}°C / GDDR 最大 ${d.gddr_temp_max_c}°C (スロットル ${d.throttle_temp_c}°C)`,
    `チップの電力 ${d.chip_power_w} W / 上限 ${d.chip_power_limit_w} W (${d.chip_voltage_v} V, ${d.chip_current_a} A)`,
    `ボード全体の電力上限 ${d.board_power_limit_w} W (ボード全体の電力は取れない)`,
    `AICLK ${d.aiclk_mhz} / ${d.aiclk_max_mhz} MHz`,
    `ファン ${d.fan_pct}% (${d.fan_rpm} rpm)`,
    `熱トリップ ${d.therm_trips} 回, GDDR エラー 訂正 ${d.gddr_corr_errs} / 訂正不能 ${d.gddr_uncorr_errs}`,
  ].join("\n");
}
async function pollHealth() {
  try {
    const key = store.get("apiKey", "");
    const r = await fetch("/health", { headers: key ? { authorization: "Bearer " + key } : {} });
    const h = await r.json();
    if (h.status !== "ok") status.textContent = "サーバー: " + h.status;
    else if (status.textContent.startsWith("サーバー")) status.textContent = "";
    showBoard(h.board);
  } catch (e) {
    if (!ctrl) status.textContent = "サーバーに接続できません";
  }
}
pollHealth();
setInterval(pollHealth, 10000);
input.focus();
</script>
</body>
</html>
